name: Deploy website to GitHub Pages

# This workflow no longer runs Hugo. It just publishes the plain static
# files in the /site folder as-is (index.html, publications page, teaching
# page, images, resume, and the individual .bib citation files). If you
# ever want to go back to the modular Hugo Blox setup, the old source
# (content/, config/, layouts/, etc.) is still in the repo, untouched --
# you'd just need to point this workflow at Hugo again.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
